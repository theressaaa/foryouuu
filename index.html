<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For You ♡</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
}

body {
    overflow: hidden;
    background: #070d20;
    font-family: Georgia, serif;
}


/* =========================
   COVER
========================= */

.cover {
    position: relative;

    width: 100%;
    height: 100vh;
    height: 100svh;

    display: flex;
    align-items: center;
    justify-content: center;

    overflow: hidden;

    background:
        radial-gradient(
            circle at 50% 43%,
            #263b64 0%,
            #142342 36%,
            #070d20 80%
        );
}


/* =========================
   STARS
========================= */

.stars {
    position: absolute;
    inset: 0;

    pointer-events: none;
}

.star {
    position: absolute;

    color: #dce7ff;

    opacity: 0.5;

    animation:
        twinkle 3s ease-in-out infinite;
}

@keyframes twinkle {

    0%,
    100% {
        opacity: 0.18;
        transform: scale(0.8);
    }

    50% {
        opacity: 0.9;
        transform: scale(1.2);
    }
}


/* =========================
   CONTENT
========================= */

.content {
    position: relative;

    z-index: 2;

    width: 100%;
    max-width: 430px;

    padding: 20px;

    text-align: center;

    animation:
        appear 1.1s ease;
}

@keyframes appear {

    from {
        opacity: 0;
        transform: translateY(18px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}


/* =========================
   TEXT
========================= */

.top-text {
    margin-bottom: 7px;

    font-family: Arial, sans-serif;

    font-size: 9px;

    letter-spacing: 4px;

    text-transform: uppercase;

    color: #aebde0;
}

h1 {
    color: #f8e9ef;

    font-size:
        clamp(46px, 13vw, 68px);

    font-weight: normal;

    font-style: italic;

    letter-spacing: -2px;

    text-shadow:
        0 0 25px
        rgba(190, 210, 255, 0.15);
}

.subtitle {
    margin-top: 7px;

    color: #b9c7e5;

    font-size: 13px;

    letter-spacing: 0.7px;
}


/* =========================
   LOVE AREA
========================= */

.love-area {
    position: relative;

    width: 250px;
    height: 250px;

    margin:
        10px auto 8px;

    display: flex;

    align-items: center;
    justify-content: center;

    animation:
        loveFloat 4s ease-in-out infinite;
}

@keyframes loveFloat {

    0%,
    100% {
        transform:
            translateY(0)
            rotate(-2deg);
    }

    50% {
        transform:
            translateY(-9px)
            rotate(2deg);
    }
}


/* =========================
   BIG LOVE
========================= */

.love {
    position: relative;

    width: 135px;
    height: 120px;

    transform:
        rotate(-45deg);

    border-radius:
        18px 0 18px 0;

    background:
        linear-gradient(
            145deg,
            #ffd9e7 0%,
            #f4a9c5 42%,
            #d9789e 100%
        );

    box-shadow:

        inset
        10px 8px 18px
        rgba(255,255,255,0.28),

        inset
        -12px -13px 20px
        rgba(150,50,90,0.18),

        0 20px 35px
        rgba(0,0,0,0.25),

        0 0 45px
        rgba(240,150,190,0.16);

    animation:
        heartbeat 2.5s ease-in-out infinite;
}


/* LOVE TOPS */

.love::before,
.love::after {
    content: "";

    position: absolute;

    width: 135px;
    height: 120px;

    border-radius: 50%;

    background:
        linear-gradient(
            145deg,
            #ffd9e7 0%,
            #f4a9c5 42%,
            #d9789e 100%
        );
}

.love::before {
    top: -60px;
    left: 0;
}

.love::after {
    top: 0;
    left: 60px;
}


/* HEARTBEAT */

@keyframes heartbeat {

    0%,
    100% {
        transform:
            rotate(-45deg)
            scale(1);
    }

    45% {
        transform:
            rotate(-45deg)
            scale(1.035);
    }

    55% {
        transform:
            rotate(-45deg)
            scale(1);
    }
}


/* =========================
   HEART SHINE
========================= */

.heart-shine {
    position: absolute;

    z-index: 5;

    width: 25px;
    height: 40px;

    top: 48px;
    left: 93px;

    border-radius: 50%;

    background:
        rgba(255,255,255,0.35);

    transform:
        rotate(45deg)
        skewY(-10deg);

    filter:
        blur(2px);

    pointer-events: none;
}


/* =========================
   LITTLE SPARKLES
========================= */

.sparkle {
    position: absolute;

    color: #f8dce8;

    font-size: 18px;

    animation:
        sparkleFloat 3s ease-in-out infinite;
}

.sparkle.one {
    top: 48px;
    left: 25px;
}

.sparkle.two {
    top: 78px;
    right: 18px;

    font-size: 13px;

    animation-delay: 1s;
}

.sparkle.three {
    bottom: 45px;
    left: 42px;

    font-size: 11px;

    animation-delay: 1.7s;
}

@keyframes sparkleFloat {

    0%,
    100% {
        opacity: .25;
        transform: scale(.8);
    }

    50% {
        opacity: 1;
        transform: scale(1.2);
    }
}


/* =========================
   BUTTON
========================= */

.open-btn {
    padding:
        13px 27px;

    border:
        1px solid
        rgba(180,200,240,0.55);

    border-radius: 50px;

    background:
        rgba(35,52,88,0.65);

    color: #f8eaf0;

    font-size: 13px;

    letter-spacing: 1px;

    cursor: pointer;

    transition:
        0.3s ease;
}

.open-btn:hover {

    transform:
        translateY(-3px);

    background:
        rgba(60,80,120,0.8);

    box-shadow:
        0 0 30px
        rgba(170,190,240,0.18);
}

.open-btn:active {

    transform:
        scale(0.96);
}


/* =========================
   BOTTOM TEXT
========================= */

.bottom-text {

    margin-top: 18px;

    color: #8294bc;

    font-family: Arial, sans-serif;

    font-size: 9px;

    letter-spacing: 2px;
}


/* =========================
   SMALL SCREEN
========================= */

@media (max-height: 700px) {

    .content {
        transform:
            scale(0.86);
    }

    .love-area {
        margin-top: 4px;
        margin-bottom: 4px;
    }
}
</style>
</head>


<body>


<section class="cover">

    <!-- =====================
         STARS
    ====================== -->

    <div
        class="stars"
        id="stars">
    </div>


    <!-- =====================
         CONTENT
    ====================== -->

    <div class="content">


        <div class="top-text">
            a little something
        </div>


        <h1>
            for you ♡
        </h1>


        <div class="subtitle">
            made with love, just for you.
        </div>


        <!-- =====================
             BIG LOVE
        ====================== -->

        <div class="love-area">

            <div class="sparkle one">
                ✧
            </div>

            <div class="sparkle two">
                ✦
            </div>

            <div class="sparkle three">
                ·
            </div>


            <div class="love">

                <div class="heart-shine"></div>

            </div>

        </div>


        <!-- =====================
             BUTTON
        ====================== -->

        <button
            class="open-btn"
            onclick="openBook()">

            open the book ♡

        </button>


        <div class="bottom-text">

            a tiny book full of love ✧

        </div>


    </div>

</section>


<script>

/* =========================
   CREATE STARS
========================= */

const starContainer =
    document.getElementById("stars");

for (
    let i = 0;
    i < 65;
    i++
) {

    const star =
        document.createElement("span");

    star.className =
        "star";

    star.textContent =
        Math.random() > 0.75
        ? "✧"
        : "·";

    star.style.left =
        Math.random() * 100 + "%";

    star.style.top =
        Math.random() * 100 + "%";

    star.style.fontSize =
        (
            7 +
            Math.random() * 11
        ) + "px";

    star.style.animationDelay =
        Math.random() * 4 + "s";

    star.style.animationDuration =
        (
            2 +
            Math.random() * 4
        ) + "s";

    starContainer.appendChild(star);
}


/* =========================
   OPEN THE BOOK
========================= */

function openBook() {

    /*

       KE HALAMAN BUKU.

       NANTI SETELAH COVER
       SUDAH FIX, KITA SAMBUNG
       KE DIGITAL LOVE BOOK.
    */

}

</script>

</body>
</html>
