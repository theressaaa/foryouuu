<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For You ♡</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    width: 100%;
    height: 100vh;
    overflow: hidden;
    background: #070d20;
    font-family: Georgia, serif;
}

/* =========================
   BACKGROUND
========================= */

.cover {
    position: relative;
    width: 100%;
    height: 100vh;
    height: 100svh;

    display: flex;
    align-items: center;
    justify-content: center;

    overflow: hidden;

    background:
        radial-gradient(
            circle at 50% 45%,
            #24385f 0%,
            #142342 35%,
            #070d20 78%
        );
}

/* =========================
   STARS
========================= */

.stars {
    position: absolute;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
}

.star {
    position: absolute;
    color: #dce7ff;
    font-size: 10px;
    opacity: .5;

    animation:
        twinkle 3s ease-in-out infinite;
}

@keyframes twinkle {

    0%, 100% {
        opacity: .2;
        transform: scale(.8);
    }

    50% {
        opacity: .9;
        transform: scale(1.2);
    }
}

/* =========================
   CONTENT
========================= */

.content {
    position: relative;
    z-index: 5;

    width: 100%;
    max-width: 430px;

    padding: 20px;

    text-align: center;

    animation: fadeIn 1.2s ease;
}

@keyframes fadeIn {

    from {
        opacity: 0;
        transform: translateY(18px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* =========================
   TEXT
========================= */

.small-title {
    margin-bottom: 7px;

    font-family: Arial, sans-serif;
    font-size: 9px;
    letter-spacing: 4px;

    text-transform: uppercase;

    color: #aebde0;
}

h1 {
    color: #f7e9ef;

    font-size: clamp(46px, 13vw, 68px);
    font-weight: normal;
    font-style: italic;

    letter-spacing: -2px;
}

.subtitle {
    margin-top: 7px;

    color: #b9c7e5;

    font-size: 13px;
    letter-spacing: .7px;
}

/* =========================
   TEDDY BEAR
========================= */

.bear-area {
    position: relative;

    width: 250px;
    height: 250px;

    margin: 12px auto 10px;

    animation: floating 4s ease-in-out infinite;
}

@keyframes floating {

    0%, 100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-7px);
    }
}

/* HEAD */

.head {
    position: absolute;

    width: 145px;
    height: 130px;

    left: 52px;
    top: 15px;

    border-radius: 48% 48% 46% 46%;

    background:
        radial-gradient(
            circle at 38% 30%,
            #b9825d,
            #89583d 65%,
            #70452f
        );

    box-shadow:
        inset -7px -8px 0 rgba(70,40,25,.15),
        0 8px 14px rgba(0,0,0,.2);

    z-index: 4;
}

/* EARS */

.ear {
    position: absolute;

    width: 47px;
    height: 47px;

    top: 3px;

    border-radius: 50%;

    background: #805039;

    box-shadow:
        inset 5px 5px 0 rgba(190,130,90,.3);
}

.ear.left {
    left: 38px;
}

.ear.right {
    right: 38px;
}

/* INNER EARS */

.ear::after {
    content: "";

    position: absolute;

    width: 25px;
    height: 25px;

    left: 11px;
    top: 11px;

    border-radius: 50%;

    background: #a96f50;
}

/* FACE */

.eye {
    position: absolute;

    width: 11px;
    height: 13px;

    top: 54px;

    border-radius: 50%;

    background: #241811;
}

.eye.left {
    left: 43px;
}

.eye.right {
    right: 43px;
}

/* EYE SHINE */

.eye::after {
    content: "";

    position: absolute;

    width: 3px;
    height: 3px;

    top: 2px;
    left: 2px;

    border-radius: 50%;

    background: #fff;
}

/* MUZZLE */

.muzzle {
    position: absolute;

    width: 57px;
    height: 43px;

    left: 44px;
    top: 68px;

    border-radius: 50%;

    background: #c58b68;
}

.nose {
    position: absolute;

    width: 14px;
    height: 10px;

    left: 21px;
    top: 9px;

    border-radius: 50%;

    background: #332018;
}

.mouth {
    position: absolute;

    width: 15px;
    height: 9px;

    left: 21px;
    top: 18px;

    border-bottom: 2px solid #44291f;
    border-radius: 0 0 50% 50%;
}

/* BODY */

.body {
    position: absolute;

    width: 112px;
    height: 105px;

    left: 69px;
    top: 125px;

    border-radius: 48% 48% 40% 40%;

    background:
        radial-gradient(
            circle at 35% 25%,
            #b9825d,
            #89583d 68%,
            #70452f
        );

    box-shadow:
        inset -7px -9px 0 rgba(70,40,25,.14),
        0 9px 13px rgba(0,0,0,.18);

    z-index: 2;
}

/* BELLY */

.belly {
    position: absolute;

    width: 65px;
    height: 61px;

    left: 23px;
    top: 25px;

    border-radius: 50%;

    background: #b87955;

    opacity: .8;
}

/* =========================
   ARMS
========================= */

.arm {
    position: absolute;

    width: 38px;
    height: 62px;

    top: 137px;

    border-radius: 45%;

    background:
        linear-gradient(
            135deg,
            #9b6547,
            #784a34
        );

    z-index: 3;
}

/* KIRI */

.arm.left {
    left: 45px;

    transform:
        rotate(18deg);
}

/* KANAN */

.arm.right {
    right: 45px;

    transform:
        rotate(-18deg);
}

/* PAWS */

.arm::after {
    content: "";

    position: absolute;

    width: 31px;
    height: 25px;

    bottom: -7px;
    left: 3px;

    border-radius: 50%;

    background: #a96e4e;
}

/* =========================
   LEGS
========================= */

.leg {
    position: absolute;

    width: 47px;
    height: 42px;

    top: 207px;

    border-radius: 45% 45% 50% 50%;

    background:
        linear-gradient(
            135deg,
            #9b6547,
            #73462f
        );

    z-index: 1;
}

.leg.left {
    left: 65px;

    transform: rotate(4deg);
}

.leg.right {
    right: 65px;

    transform: rotate(-4deg);
}

/* FOOT PADS */

.leg::after {
    content: "";

    position: absolute;

    width: 31px;
    height: 22px;

    left: 8px;
    bottom: 2px;

    border-radius: 50%;

    background: #a96e4e;
}

/* =========================
   BUTTON
========================= */

.open-btn {
    border: 1px solid rgba(180,200,240,.55);

    border-radius: 50px;

    padding: 13px 27px;

    color: #f8eaf0;

    background: rgba(35,52,88,.65);

    font-size: 13px;
    letter-spacing: 1px;

    cursor: pointer;

    transition: .3s ease;
}

.open-btn:hover {

    transform: translateY(-3px);

    background: rgba(60,80,120,.8);

    box-shadow:
        0 0 30px rgba(170,190,240,.18);
}

.open-btn:active {
    transform: scale(.96);
}

/* =========================
   BOTTOM
========================= */

.bottom {
    margin-top: 18px;

    color: #8294bc;

    font-family: Arial, sans-serif;

    font-size: 9px;
    letter-spacing: 2px;
}

/* =========================
   SMALL SCREEN
========================= */

@media (max-height: 700px) {

    .content {
        transform: scale(.86);
    }

    .bear-area {
        margin-top: 4px;
        margin-bottom: 4px;
    }
}
</style>
</head>


<body>

<section class="cover">

    <!-- BINTANG -->
    <div class="stars" id="stars"></div>


    <div class="content">

        <div class="small-title">
            a little something
        </div>

        <h1>
            for you ♡
        </h1>

        <div class="subtitle">
            made with love, just for you.
        </div>


        <!-- =====================
             TEDDY BEAR
        ====================== -->

        <div class="bear-area">

            <!-- EARS -->
            <div class="ear left"></div>
            <div class="ear right"></div>

            <!-- HEAD -->
            <div class="head">

                <div class="eye left"></div>
                <div class="eye right"></div>

                <div class="muzzle">
                    <div class="nose"></div>
                    <div class="mouth"></div>
                </div>

            </div>


            <!-- ARMS -->
            <div class="arm left"></div>
            <div class="arm right"></div>


            <!-- BODY -->
            <div class="body">

                <div class="belly"></div>

            </div>


            <!-- LEGS -->
            <div class="leg left"></div>
            <div class="leg right"></div>

        </div>


        <!-- BUTTON -->

        <button
            class="open-btn"
            onclick="openBook()"
        >
            open the book ♡
        </button>


        <div class="bottom">
            a tiny book full of love ✧
        </div>

    </div>

</section>


<script>

/* =========================
   RANDOM STARS
========================= */

const starContainer =
    document.getElementById("stars");

for (let i = 0; i < 65; i++) {

    const star =
        document.createElement("span");

    star.className = "star";

    star.textContent =
        Math.random() > .75
        ? "✧"
        : "·";

    star.style.left =
        Math.random() * 100 + "%";

    star.style.top =
        Math.random() * 100 + "%";

    star.style.fontSize =
        (7 + Math.random() * 11) + "px";

    star.style.animationDelay =
        Math.random() * 4 + "s";

    starContainer.appendChild(star);
}


/* =========================
   OPEN BOOK
========================= */

function openBook() {

    /*
       NANTI KALAU HALAMAN BUKUNYA
       SUDAH DIBUAT, GANTI MENJADI:

       window.location.href = "book.html";

       Untuk sekarang belum melakukan
       apa-apa karena kita fokus cover dulu.
    */

    alert("The book is waiting for you ♡");
}

</script>

</body>
</html>
