<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For You ♡</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    overflow: hidden;
    background: #070d20;
    color: white;
    font-family: Georgia, serif;
}

/* ===== BACKGROUND ===== */

.cover {
    position: relative;
    width: 100%;
    height: 100vh;
    height: 100svh;

    display: flex;
    justify-content: center;
    align-items: center;

    text-align: center;
    overflow: hidden;

    background:
        radial-gradient(
            circle at 50% 45%,
            #1d315b 0%,
            #101d3b 35%,
            #070d20 78%
        );
}

/* ===== STARS ===== */

.stars {
    position: absolute;
    inset: 0;
    pointer-events: none;
}

.star {
    position: absolute;
    color: #dce7ff;
    opacity: 0.6;
    animation: twinkle 3s ease-in-out infinite;
}

@keyframes twinkle {
    0%, 100% {
        opacity: 0.2;
        transform: scale(0.8);
    }

    50% {
        opacity: 0.9;
        transform: scale(1.2);
    }
}

/* ===== CONTENT ===== */

.content {
    position: relative;
    z-index: 2;

    width: 100%;
    max-width: 430px;

    padding: 25px 20px;

    animation: fadeUp 1.2s ease;
}

@keyframes fadeUp {
    from {
        opacity: 0;
        transform: translateY(20px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* ===== SMALL TEXT ===== */

.top-text {
    margin-bottom: 8px;

    font-family: Arial, sans-serif;
    font-size: 10px;
    letter-spacing: 4px;
    text-transform: uppercase;

    color: #aabbe5;
}

/* ===== TITLE ===== */

h1 {
    font-size: clamp(45px, 13vw, 68px);
    font-weight: normal;
    font-style: italic;

    letter-spacing: -2px;

    color: #f7e8ef;

    text-shadow:
        0 0 25px rgba(180, 200, 255, 0.15);
}

.subtext {
    margin-top: 8px;

    font-size: 14px;
    letter-spacing: 1px;

    color: #b9c8e8;
}

/* ===== BEAR ===== */

.bear-container {
    width: min(72vw, 300px);
    height: min(72vw, 300px);

    margin: 8px auto 14px;

    display: flex;
    justify-content: center;
    align-items: center;

    animation: bearFloat 4s ease-in-out infinite;
}

.bear-container img {
    width: 100%;
    height: 100%;

    object-fit: contain;

    display: block;

    filter:
        drop-shadow(0 15px 25px rgba(0,0,0,0.4));
}

/* Kalau gambar belum ada */
.bear-fallback {
    display: none;

    font-size: 115px;
}

@keyframes bearFloat {
    0%, 100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-8px);
    }
}

/* ===== BUTTON ===== */

.open-button {
    padding: 14px 28px;

    border: 1px solid rgba(180, 200, 240, 0.55);
    border-radius: 50px;

    background: rgba(35, 52, 88, 0.65);

    color: #f8eaf0;

    font-size: 13px;
    letter-spacing: 1px;

    cursor: pointer;

    transition:
        transform 0.3s ease,
        background 0.3s ease,
        box-shadow 0.3s ease;
}

.open-button:hover {
    transform: translateY(-3px);

    background: rgba(58, 79, 121, 0.8);

    box-shadow:
        0 0 30px rgba(170, 190, 240, 0.18);
}

.open-button:active {
    transform: scale(0.96);
}

/* ===== BOTTOM TEXT ===== */

.bottom-text {
    margin-top: 20px;

    font-family: Arial, sans-serif;
    font-size: 9px;
    letter-spacing: 2px;

    color: #8495bd;
}

/* ===== HP KECIL ===== */

@media (max-height: 700px) {

    .content {
        transform: scale(0.88);
    }

    .bear-container {
        margin-top: 0;
        margin-bottom: 8px;
    }
}
</style>
</head>

<body>

<section class="cover">

    <!-- BINTANG -->
    <div class="stars" id="stars"></div>

    <div class="content">

        <div class="top-text">
            a little something
        </div>

        <h1>
            for you ♡
        </h1>

        <div class="subtext">
            made with love, just for you.
        </div>


        <!-- =========================
             BERUANG + MAWAR
             ========================= -->

        <div class="bear-container">

            <!--
                GANTI bear.png DENGAN
                GAMBAR BERUANG REFERENSI LU

                File:
                bear.png
            -->

            <img
                src="bear.png"
                alt="cute teddy bear holding a rose"
                onerror="
                    this.style.display='none';
                    document.getElementById('fallback').style.display='block';
                "
            >

            <div
                class="bear-fallback"
                id="fallback"
            >
                🧸🌹
            </div>

        </div>


        <!-- TOMBOL -->

        <button
            class="open-button"
            onclick="openBook()"
        >
            open the book ♡
        </button>


        <div class="bottom-text">
            a tiny book full of love ✧
        </div>

    </div>

</section>


<script>

/* =========================
   RANDOM STARS
   ========================= */

const stars = document.getElementById("stars");

for (let i = 0; i < 65; i++) {

    const star = document.createElement("span");

    star.classList.add("star");

    star.innerHTML =
        Math.random() > 0.75
        ? "✧"
        : "·";

    star.style.left =
        Math.random() * 100 + "%";

    star.style.top =
        Math.random() * 100 + "%";

    star.style.fontSize =
        (7 + Math.random() * 12) + "px";

    star.style.animationDelay =
        Math.random() * 4 + "s";

    star.style.animationDuration =
        (2 + Math.random() * 4) + "s";

    stars.appendChild(star);
}


/* =========================
   OPEN THE BOOK
   ========================= */

function openBook() {

    /*
        NANTI BAGIAN INI
        DISAMBUNGKAN KE HALAMAN
        DIGITAL LOVE BOOK LU.

        Contoh kalau bukunya
        ada di book.html:
    */

    window.location.href = "book.html";
}

</script>

</body>
</html>
