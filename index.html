<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For You ♡</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
}

body {
    overflow: hidden;
    background: #070d20;
    font-family: Georgia, serif;
}

/* =========================
   COVER
========================= */

.cover {
    position: relative;

    width: 100%;
    height: 100vh;
    height: 100svh;

    display: flex;
    align-items: center;
    justify-content: center;

    overflow: hidden;

    background:
        radial-gradient(
            circle at 50% 43%,
            #263b64 0%,
            #142342 36%,
            #070d20 80%
        );
}

/* =========================
   STARS
========================= */

.stars {
    position: absolute;
    inset: 0;

    pointer-events: none;
}

.star {
    position: absolute;

    color: #dce7ff;

    opacity: 0.5;

    animation:
        twinkle 3s ease-in-out infinite;
}

@keyframes twinkle {

    0%, 100% {
        opacity: 0.2;
        transform: scale(0.8);
    }

    50% {
        opacity: 0.9;
        transform: scale(1.2);
    }
}

/* =========================
   CONTENT
========================= */

.content {
    position: relative;
    z-index: 2;

    width: 100%;
    max-width: 430px;

    padding: 20px;

    text-align: center;

    animation: appear 1.1s ease;
}

@keyframes appear {

    from {
        opacity: 0;
        transform: translateY(18px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* =========================
   TEXT
========================= */

.top-text {
    margin-bottom: 7px;

    font-family: Arial, sans-serif;

    font-size: 9px;
    letter-spacing: 4px;

    text-transform: uppercase;

    color: #aebde0;
}

h1 {
    color: #f8e9ef;

    font-size: clamp(46px, 13vw, 68px);

    font-weight: normal;
    font-style: italic;

    letter-spacing: -2px;

    text-shadow:
        0 0 25px rgba(190, 210, 255, 0.15);
}

.subtitle {
    margin-top: 7px;

    color: #b9c7e5;

    font-size: 13px;

    letter-spacing: 0.7px;
}

/* =========================
   BEAR
========================= */

.bear-area {
    position: relative;

    width: 250px;
    height: 250px;

    margin: 10px auto 8px;

    animation:
        bearFloat 4s ease-in-out infinite;
}

@keyframes bearFloat {

    0%, 100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-7px);
    }
}

/* =========================
   EARS
========================= */

.ear {
    position: absolute;

    top: 13px;

    width: 52px;
    height: 52px;

    border-radius: 50%;

    background: #765039;

    box-shadow:
        inset 5px 5px 0 #a66d4c;

    z-index: 2;
}

.ear::after {
    content: "";

    position: absolute;

    width: 26px;
    height: 26px;

    left: 13px;
    top: 13px;

    border-radius: 50%;

    background: #b67a58;
}

.ear.left {
    left: 39px;
}

.ear.right {
    right: 39px;
}

/* =========================
   HEAD
========================= */

.head {
    position: absolute;

    left: 53px;
    top: 23px;

    width: 144px;
    height: 130px;

    border-radius: 48%;

    background:
        radial-gradient(
            circle at 36% 28%,
            #b9825d,
            #89583d 66%,
            #70452f
        );

    box-shadow:
        inset -7px -8px 0 rgba(65,36,22,0.13),
        0 7px 12px rgba(0,0,0,0.2);

    z-index: 4;
}

/* =========================
   EYES
========================= */

.eye {
    position: absolute;

    top: 53px;

    width: 11px;
    height: 13px;

    border-radius: 50%;

    background: #241811;
}

.eye.left {
    left: 42px;
}

.eye.right {
    right: 42px;
}

.eye::after {
    content: "";

    position: absolute;

    left: 2px;
    top: 2px;

    width: 3px;
    height: 3px;

    border-radius: 50%;

    background: white;
}

/* =========================
   MUZZLE
========================= */

.muzzle {
    position: absolute;

    left: 43px;
    top: 68px;

    width: 58px;
    height: 44px;

    border-radius: 50%;

    background: #c58b68;
}

.nose {
    position: absolute;

    left: 22px;
    top: 9px;

    width: 14px;
    height: 10px;

    border-radius: 50%;

    background: #332018;
}

.mouth {
    position: absolute;

    left: 22px;
    top: 18px;

    width: 14px;
    height: 8px;

    border-bottom:
        2px solid #44291f;

    border-radius:
        0 0 50% 50%;
}

/* =========================
   BODY
========================= */

.body {
    position: absolute;

    left: 69px;
    top: 130px;

    width: 112px;
    height: 100px;

    border-radius:
        48% 48% 40% 40%;

    background:
        radial-gradient(
            circle at 35% 25%,
            #b9825d,
            #89583d 68%,
            #70452f
        );

    box-shadow:
        inset -7px -8px 0 rgba(65,36,22,0.13),
        0 8px 12px rgba(0,0,0,0.2);

    z-index: 2;
}

/* BELLY */

.belly {
    position: absolute;

    left: 23px;
    top: 24px;

    width: 66px;
    height: 61px;

    border-radius: 50%;

    background: #b87955;

    opacity: 0.78;
}

/* =========================
   ARMS
========================= */

.arm {
    position: absolute;

    top: 139px;

    width: 39px;
    height: 57px;

    border-radius: 48%;

    background:
        linear-gradient(
            135deg,
            #9b6547,
            #784a34
        );

    z-index: 3;
}

.arm.left {
    left: 46px;

    transform: rotate(20deg);
}

.arm.right {
    right: 46px;

    transform: rotate(-20deg);
}

/* PAWS */

.arm::after {
    content: "";

    position: absolute;

    left: 4px;
    bottom: -5px;

    width: 31px;
    height: 24px;

    border-radius: 50%;

    background: #a96e4e;
}

/* =========================
   LEGS
========================= */

.leg {
    position: absolute;

    top: 208px;

    width: 48px;
    height: 39px;

    border-radius:
        45% 45% 50% 50%;

    background:
        linear-gradient(
            135deg,
            #9b6547,
            #73462f
        );

    z-index: 1;
}

.leg.left {
    left: 65px;

    transform: rotate(4deg);
}

.leg.right {
    right: 65px;

    transform: rotate(-4deg);
}

/* FOOT */

.leg::after {
    content: "";

    position: absolute;

    left: 8px;
    bottom: 2px;

    width: 31px;
    height: 21px;

    border-radius: 50%;

    background: #a96e4e;
}

/* =========================
   BUTTON
========================= */

.open-btn {
    padding: 13px 27px;

    border:
        1px solid rgba(180,200,240,0.55);

    border-radius: 50px;

    background:
        rgba(35,52,88,0.65);

    color: #f8eaf0;

    font-size: 13px;
    letter-spacing: 1px;

    cursor: pointer;

    transition: 0.3s ease;
}

.open-btn:hover {

    transform:
        translateY(-3px);

    background:
        rgba(60,80,120,0.8);

    box-shadow:
        0 0 30px rgba(170,190,240,0.18);
}

.open-btn:active {

    transform:
        scale(0.96);
}

/* =========================
   BOTTOM TEXT
========================= */

.bottom-text {

    margin-top: 18px;

    color: #8294bc;

    font-family: Arial, sans-serif;

    font-size: 9px;

    letter-spacing: 2px;
}

/* =========================
   SMALL PHONE
========================= */

@media (max-height: 700px) {

    .content {
        transform: scale(0.86);
    }

    .bear-area {
        margin-top: 4px;
        margin-bottom: 4px;
    }
}
</style>
</head>

<body>

<section class="cover">

    <!-- STARS -->
    <div
        class="stars"
        id="stars">
    </div>


    <div class="content">

        <div class="top-text">
            a little something
        </div>


        <h1>
            for you ♡
        </h1>


        <div class="subtitle">
            made with love, just for you.
        </div>


        <!-- =====================
             CSS TEDDY BEAR
        ====================== -->

        <div class="bear-area">

            <!-- EARS -->
            <div class="ear left"></div>
            <div class="ear right"></div>


            <!-- HEAD -->
            <div class="head">

                <div class="eye left"></div>
                <div class="eye right"></div>

                <div class="muzzle">

                    <div class="nose"></div>

                    <div class="mouth"></div>

                </div>

            </div>


            <!-- ARMS -->
            <div class="arm left"></div>
            <div class="arm right"></div>


            <!-- BODY -->
            <div class="body">

                <div class="belly"></div>

            </div>


            <!-- LEGS -->
            <div class="leg left"></div>
            <div class="leg right"></div>

        </div>


        <!-- OPEN BUTTON -->

        <button
            class="open-btn"
            onclick="openBook()">

            open the book ♡

        </button>


        <div class="bottom-text">

            a tiny book full of love ✧

        </div>

    </div>

</section>


<script>

/* =========================
   CREATE STARS
========================= */

const starContainer =
    document.getElementById("stars");

for (let i = 0; i < 65; i++) {

    const star =
        document.createElement("span");

    star.className = "star";

    star.textContent =
        Math.random() > 0.75
        ? "✧"
        : "·";

    star.style.left =
        Math.random() * 100 + "%";

    star.style.top =
        Math.random() * 100 + "%";

    star.style.fontSize =
        (7 + Math.random() * 11) + "px";

    star.style.animationDelay =
        Math.random() * 4 + "s";

    star.style.animationDuration =
        (2 + Math.random() * 4) + "s";

    starContainer.appendChild(star);
}


/* =========================
   OPEN BOOK
========================= */

function openBook() {

    /*
       UNTUK SEKARANG KOSONG DULU.
       NANTI PAS HALAMAN BUKU SUDAH JADI,
       BARU DISAMBUNGKAN KE HALAMAN BERIKUTNYA.
    */

}

</script>

</body>
</html>
