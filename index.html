<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>For You ♡</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
        }

        body {
            overflow: hidden;
            background: #070d20;
            font-family: Georgia, serif;
        }

        .cover {
            width: 100%;
            height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            text-align: center;

            background:
                radial-gradient(
                    circle,
                    #293f6b,
                    #172746 45%,
                    #070d20 100%
                );
        }

        .content {
            width: 100%;
            padding: 25px;
        }

        .small {
            color: #aebde0;
            font-family: Arial, sans-serif;
            font-size: 10px;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        h1 {
            margin: 10px 0 5px;

            color: #f8e9ef;

            font-size: 60px;
            font-weight: normal;
            font-style: italic;
        }

        .subtitle {
            color: #bac8e4;
            font-size: 13px;
        }

        .heart-box {
            margin: 35px auto;

            width: 140px;
            height: 140px;

            animation: float 3s ease-in-out infinite;
        }

        .heart {
            width: 100%;
            height: 100%;
        }

        @keyframes float {
            0% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }

            100% {
                transform: translateY(0);
            }
        }

        button {
            padding: 13px 28px;

            border: 1px solid #7183aa;
            border-radius: 30px;

            background: rgba(40, 60, 100, 0.7);

            color: #f8eaf0;

            font-size: 13px;
            letter-spacing: 1px;
        }

        .bottom {
            margin-top: 20px;

            color: #8294bc;

            font-family: Arial, sans-serif;
            font-size: 9px;
            letter-spacing: 2px;
        }
    </style>
</head>

<body>

<div class="cover">

    <div class="content">

        <div class="small">
            a little something
        </div>

        <h1>
            for you ♡
        </h1>

        <div class="subtitle">
            made with love, just for you.
        </div>


        <div class="heart-box">

            <svg
                class="heart"
                viewBox="0 0 200 200"
                xmlns="http://www.w3.org/2000/svg">

                <defs>

                    <linearGradient
                        id="pink"
                        x1="0"
                        y1="0"
                        x2="1"
                        y2="1">

                        <stop
                            offset="0%"
                            stop-color="#ffdce9"/>

                        <stop
                            offset="50%"
                            stop-color="#f3a9c5"/>

                        <stop
                            offset="100%"
                            stop-color="#d7779d"/>

                    </linearGradient>

                </defs>

                <path
                    d="
                    M100 175
                    C85 155 25 120 25 65
                    C25 35 48 20 70 25
                    C87 29 96 42 100 55
                    C104 42 113 29 130 25
                    C152 20 175 35 175 65
                    C175 120 115 155 100 175
                    Z
                    "
                    fill="url(#pink)"
                />

            </svg>

        </div>


        <button>
            open the book ♡
        </button>


        <div class="bottom">
            a tiny book full of love ✧
        </div>

    </div>

</div>

</body>
</html>
